<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1780" viewBox="0 0 1220 1780" role="img" aria-labelledby="title desc">
<title id="title">Growth Atlas: recorrido del producto de destino</title>
<desc id="desc">Entrada del producto, atlas, dossier, comparación, campaña, ejecución por el equipo, resultados e historial. Una URL de Luma entra al dossier tras revisión. Cuando faltan confirmaciones se piden datos antes de recomendar gasto. Los antecedentes pertinentes vuelven al dossier de una próxima evaluación.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#999891" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1220" height="1780" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
